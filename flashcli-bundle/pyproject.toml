[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashcli-bundle"
version = "0.1.0"
description = "flashcli Model Bundle protocol — manifest, options, and engine types for bundle authors."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flashcli_bundle = ["py.typed"]
