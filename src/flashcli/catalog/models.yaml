# flashcli 模型目录 — 每 preset 一个 bundle zip；运行时从 lib/*.so 按环境选择
#
# 构建：bash scripts/release_bundle.sh --bundle <name>  或  bundles/<name>/release.sh
# 文档：docs/runtime-matrix.zh-CN.md、scripts/lib/bundle_hooks.sh

schema_version: 6

models:

  pi05_libero:
    description: Pi0.5 LIBERO — lerobot/pi05_libero_finetuned_v044 (SM89/SM120)
    bundle:
      zip: https://flashhub-cdn.aodianyun.com/repo/5/versions/6/flashcli-bundle-pi05-main-sm89-multi-linux-x86_64.zip
      # path: bundles/pi05_libero
      # git: xxx

  # 共享同一 runtime zip；bundle_variant 选权重（HF 按 preset 名缓存）
  qwen3-8b-nvfp4:
    description: Qwen3-8B NVFP4 (SM120) — kaitchup/Qwen3-8B-NVFP4
    bundle_variant: qwen3
    bundle:
      zip: https://flashhub-cdn.aodianyun.com/repo/6/versions/7/flashcli-bundle-qwen_nvfp4-main-sm120-multi-linux-x86_64.zip
      # path: bundles/qwen_nvfp4 

  qwen36-27b-nvfp4:
