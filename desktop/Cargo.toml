[package]
name = "flashserver-desktop"
version = "1.0.7"
edition = "2021"

[[bin]]
name = "FlashServer"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
egui_extras = "0.31"
egui_plot = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
ewebsock = "0.6"
webbrowser = "1"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
