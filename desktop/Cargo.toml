[package]
name = "flashserver-desktop"
version = "1.0.6"
edition = "2021"

[[bin]]
name = "FlashServer"
path = "src/main.rs"

[dependencies]
slint = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
ewebsock = "0.6"
webbrowser = "1"
arboard = "3"

[build-dependencies]
slint-build = "1.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
