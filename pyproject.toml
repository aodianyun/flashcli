[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashcli"
version = "0.1.1.2026.5.22"
description = "FlashRT distribution CLI — model bundles, inference, serve."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "packaging>=23.0",
    "huggingface_hub>=0.26",
    "tqdm>=4.66",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# HTTP serve layer (flashcli.serve — not bundle inference runtime).
serve = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.24",
]
# Dev convenience only — production installs from runtime manifest / FlashRT pyproject.
dev = ["flash-rt[torch,server]"]

[project.scripts]
flashcli = "flashcli.cli:app"
flash = "flashcli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flashcli = ["py.typed", "catalog/models.yaml"]
