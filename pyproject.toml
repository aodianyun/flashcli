[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashcli"
version = "1.0.2.2026.10.9"
description = "FlashRT distribution CLI — Go host (bundles, sync, runtime)."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
# The host is now a static Go binary under go/. This project remains the single
# source of truth for the version (read by scripts/build_go.sh) and keeps the
# protocol + infer package (flashcli-bundle/) buildable for bundle venvs.
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--ignore=tests/bench"]
