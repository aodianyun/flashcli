<text x="215.0" y="624" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Offline guarantee</text>
<text x="215.0" y="644" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">A complete cache that satisfies bundle</text>
<text x="215.0" y="661" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">readiness stays offline; only explicit</text>
<text x="215.0" y="678" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">pull, missing assets or schemas go online.</text>
