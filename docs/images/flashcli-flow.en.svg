<text x="605.0" y="781" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">download manifest · resume</text>
<text x="605.0" y="798" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">post_pull · extra_pull</text>
<rect x="830" y="150" width="330" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="995.0" y="174" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Execution note</text>
<text x="995.0" y="194" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">Entry runs inside the bundle venv;</text>
<text x="995.0" y="211" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">the host never imports model code.</text>
<rect x="1210" y="150" width="330" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="1375.0" y="174" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">FlashRT note</text>
<text x="1375.0" y="194" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">Imported by the bundle entry;</text>
<text x="1375.0" y="211" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">not a host pip dependency.</text>
<rect x="830" y="300" width="330" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="995.0" y="324" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Serve note</text>
<text x="995.0" y="344" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">serve mounts OpenAI / Anthropic routes;</text>
<text x="995.0" y="361" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">run exits after one result.</text>
<rect x="1210" y="300" width="330" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="1375.0" y="324" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Cache note</text>
<text x="1375.0" y="344" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">Weights are shared by source/repo@revision;</text>
<text x="1375.0" y="361" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">runtime is per runtime cell.</text>
<rect x="830" y="450" width="330" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="995.0" y="474" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Gateway invariant</text>
<text x="995.0" y="494" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">Routes are capability-gated;</text>
<text x="995.0" y="511" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">the child endpoint stays internal.</text>
<rect x="1210" y="450" width="330" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="1375.0" y="474" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Isolation</text>
<text x="1375.0" y="494" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">Bundle code uses flashcli-bundle protocol;</text>
<text x="1375.0" y="511" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">it never imports host packages.</text>
