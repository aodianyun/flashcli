<text x="995.0" y="781" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">RunEngine / ServeEngine</text>
<text x="995.0" y="798" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">native-exec / native-abi</text>
