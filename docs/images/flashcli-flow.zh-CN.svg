<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="800.0" y="46" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#0f172a">flashcli 运行 / 服务流程</text>
<text x="800.0" y="74" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">ref 解析 → 缓存、运行时与权重 → entry → run 或 serve</text>
<rect x="36" y="105" width="360" height="760" rx="16" fill="#dbeafe" opacity="0.35" stroke="#e2e8f0" stroke-width="1"/>
<text x="52" y="129" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#475569">1 · 解析</text>
<rect x="420" y="105" width="360" height="760" rx="16" fill="#dcfce7" opacity="0.35" stroke="#e2e8f0" stroke-width="1"/>
<text x="436" y="129" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#475569">2 · 准备</text>
<rect x="804" y="105" width="360" height="760" rx="16" fill="#fef3c7" opacity="0.35" stroke="#e2e8f0" stroke-width="1"/>
<text x="820" y="129" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#475569">3 · 执行</text>
<rect x="1188" y="105" width="376" height="760" rx="16" fill="#fce7f3" opacity="0.35" stroke="#e2e8f0" stroke-width="1"/>
<text x="1204" y="129" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#475569">运行时</text>
<rect x="50" y="150" width="330" height="95" rx="12" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.4"/>
<text x="215.0" y="174" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1f2937">输入</text>
<text x="215.0" y="194" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">flashcli run | serve &lt;ref&gt;</text>
<text x="215.0" y="211" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">FlashHub ref 或本地 bundles/&lt;name&gt;</text>
