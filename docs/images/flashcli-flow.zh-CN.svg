<text x="215.0" y="319" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1f2937">解析 ref</text>
<text x="215.0" y="339" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">namespace / name / version</text>
<text x="215.0" y="356" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">variant · cache key</text>
<polygon points="215.0,420 320,470.0 215.0,520 110,470.0" fill="#fef9c3" stroke="#eab308" stroke-width="1.4"/>
<text x="215.0" y="457.0" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937">本地缓存</text>
<text x="215.0" y="475.0" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937">完整?</text>
<rect x="50" y="600" width="330" height="120" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="215.0" y="624" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">离线保证</text>
<text x="215.0" y="644" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">缓存完整且满足 bundle readiness</text>
<text x="215.0" y="661" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">时保持离线；只有显式 pull、</text>
<text x="215.0" y="678" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">缺失资产或 schema 升级才联网。</text>
<rect x="440" y="295" width="330" height="95" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="1.4"/>
<text x="605.0" y="319" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1f2937">FlashHub 同步</text>
<text x="605.0" y="339" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">repo index · manifest</text>
<text x="605.0" y="356" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">bundle 文件 · runtime 目录</text>
<text x="605.0" y="373" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">权重元数据</text>
<rect x="440" y="430" width="330" height="100" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.4"/>
<text x="605.0" y="454" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1f2937">Preflight</text>
<text x="605.0" y="474" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">GPU / CUDA / Python ABI</text>
<text x="605.0" y="491" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">runtime cell 匹配</text>
<text x="605.0" y="508" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">system requirements</text>
<rect x="440" y="580" width="330" height="90" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="1.4"/>
<text x="605.0" y="604" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1f2937">运行时 / venv</text>
<text x="605.0" y="624" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">uv 或 pip</text>
<text x="605.0" y="641" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">flashcli-bundle[infer]</text>
<text x="605.0" y="658" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">python_dependencies</text>
<rect x="440" y="720" width="330" height="90" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
<text x="605.0" y="744" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1f2937">权重准备</text>
<text x="605.0" y="764" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">共享 models/store/</text>
<text x="605.0" y="781" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">下载清单 · 续传</text>
<text x="605.0" y="798" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11.5" fill="#475569">post_pull · extra_pull</text>
<rect x="830" y="150" width="330" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="995.0" y="174" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">执行说明</text>
<text x="995.0" y="194" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">Entry 在 bundle venv 内运行；</text>
<text x="995.0" y="211" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">host 不导入模型代码。</text>
<rect x="1210" y="150" width="330" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="1375.0" y="174" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">FlashRT 说明</text>
<text x="1375.0" y="194" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">由 bundle entry 导入；</text>
<text x="1375.0" y="211" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">不是 host 的 pip 依赖。</text>
<rect x="830" y="300" width="330" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="995.0" y="324" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Serve 说明</text>
<text x="995.0" y="344" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">serve 挂载 OpenAI / Anthropic 路由；</text>
<text x="995.0" y="361" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">run 输出一次结果后退出。</text>
<rect x="1210" y="300" width="330" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="1375.0" y="324" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">缓存说明</text>
<text x="1375.0" y="344" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">权重按 source/repo@revision 共享；</text>
<text x="1375.0" y="361" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">runtime 按 cell 独立。</text>
<rect x="830" y="450" width="330" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="995.0" y="474" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">网关不变量</text>
<text x="995.0" y="494" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">路由按 capability 挂载；</text>
<text x="995.0" y="511" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">child endpoint 不对外暴露。</text>
<rect x="1210" y="450" width="330" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="1375.0" y="474" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">隔离</text>
<text x="1375.0" y="494" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">bundle 代码只使用 flashcli-bundle 协议；</text>
<text x="1375.0" y="511" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">不导入 host 包。</text>
<rect x="830" y="720" width="330" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
<text x="995.0" y="744" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#1f2937">执行入口</text>
