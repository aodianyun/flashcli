<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="800.0" y="46" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#0f172a">flashserver application lifecycle</text>
<text x="800.0" y="74" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">install → prepare → setup → ready; models are always started on demand by the scheduler</text>
<rect x="40" y="350" width="240" height="110" rx="12" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.4"/>
<text x="160.0" y="374" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937">PLANNED</text>
<text x="160.0" y="394" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">manifest valid</text>
<text x="160.0" y="410" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">platform supported</text>
<rect x="330" y="350" width="250" height="110" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="1.4"/>
<text x="455.0" y="374" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937">INSTALL</text>
<text x="455.0" y="394" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">client script / installer</text>
<text x="455.0" y="410" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">or skip (models only)</text>
<rect x="630" y="350" width="250" height="110" rx="12" fill="#fef9c3" stroke="#eab308" stroke-width="1.4"/>
<text x="755.0" y="374" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937">PREPARED</text>
<text x="755.0" y="394" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">default bundles</text>
<text x="755.0" y="410" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">disk ready (preload)</text>
<rect x="930" y="350" width="250" height="110" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="1055.0" y="374" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937">SETUP (action)</text>
<text x="1055.0" y="394" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">not a stored state</text>
<text x="1055.0" y="410" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">write gateway connection</text>
<text x="1055.0" y="426" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">run confirmed setup scripts</text>
<rect x="1230" y="350" width="240" height="110" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
<text x="1350.0" y="374" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937">READY</text>
<text x="1350.0" y="394" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">app configured</text>
<text x="1350.0" y="410" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">inference goes to /v1</text>
<rect x="330" y="180" width="250" height="100" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1.4"/>
<text x="455.0" y="204" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937">FAILED</text>
<text x="455.0" y="224" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">install/prepare failed</text>
<text x="455.0" y="240" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">logs retained</text>
<rect x="1230" y="600" width="330" height="100" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
<text x="1395.0" y="624" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Gateway /v1</text>
<text x="1395.0" y="644" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">scheduler starts residents</text>
<text x="1395.0" y="660" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">app has no PID / endpoint</text>
<rect x="40" y="600" width="500" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="290.0" y="624" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">Invariant</text>
<text x="290.0" y="644" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">App state never stores a model pid or child endpoint.</text>
<text x="290.0" y="660" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">All inference goes through the gateway.</text>
<path d="M 280,405 L 330,405" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="305" y="395" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#64748b" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">install</text>
<path d="M 580,405 L 630,405" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="605" y="395" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#64748b" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">script / installer done</text>
<path d="M 880,405 L 930,405" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="905" y="395" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#64748b" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">explicit setup</text>
<path d="M 1180,405 L 1230,405" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1205" y="395" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#64748b" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">setup ok</text>
<path d="M 1180,440 L 1230,440" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="1205" y="432" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#f59e0b" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">script failed, still READY</text>
<path d="M 455,350 L 455,280" fill="none" stroke="#ef4444" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="420" y="310" text-anchor="end" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#ef4444" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">failed</text>
<path d="M 520,280 L 520,350" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="527" y="330" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#94a3b8" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">retry</text>
<path d="M 160,350 L 160,300 L 755,300 L 755,350" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="450" y="290" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#94a3b8" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">skip / no model</text>
<path d="M 1350,460 L 1350,600" fill="none" stroke="#0284c7" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1358" y="540" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#0284c7" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">inference request</text>
<path d="M 1230,460 L 1205,460 L 1205,760 L 600,760 L 600,500 L 280,500 L 280,460" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="750" y="750" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#94a3b8" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">uninstall / reinstall</text>
</svg>