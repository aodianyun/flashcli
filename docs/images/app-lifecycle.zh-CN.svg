<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="800.0" y="46" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" fill="#0f172a">flashserver 应用生命周期</text>
<text x="800.0" y="74" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">install → prepare → setup → ready；模型始终由调度器按需启动</text>
<rect x="40" y="350" width="240" height="110" rx="12" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.4"/>
<text x="160.0" y="374" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937">PLANNED</text>
<text x="160.0" y="394" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">manifest 合法</text>
<text x="160.0" y="410" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">平台支持</text>
<rect x="330" y="350" width="250" height="110" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="1.4"/>
<text x="455.0" y="374" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937">INSTALL</text>
<text x="455.0" y="394" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">客户端脚本 / 安装包</text>
<text x="455.0" y="410" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">或 skip（仅准备模型）</text>
<rect x="630" y="350" width="250" height="110" rx="12" fill="#fef9c3" stroke="#eab308" stroke-width="1.4"/>
<text x="755.0" y="374" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937">PREPARED</text>
<text x="755.0" y="394" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">default bundles</text>
<text x="755.0" y="410" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">磁盘就绪（preload）</text>
<rect x="930" y="350" width="250" height="110" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="1055.0" y="374" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937">SETUP（操作）</text>
<text x="1055.0" y="394" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">不是持久化状态</text>
<text x="1055.0" y="410" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">写入网关连接</text>
<text x="1055.0" y="426" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">执行确认过的 setup scripts</text>
<rect x="1230" y="350" width="240" height="110" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1.4"/>
<text x="1350.0" y="374" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937">READY</text>
<text x="1350.0" y="394" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">应用已配置</text>
<text x="1350.0" y="410" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">推理走 /v1</text>
<rect x="330" y="180" width="250" height="100" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1.4"/>
<text x="455.0" y="204" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937">FAILED</text>
<text x="455.0" y="224" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">安装/准备失败</text>
<text x="455.0" y="240" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">保留日志</text>
<rect x="1230" y="600" width="330" height="100" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
<text x="1395.0" y="624" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Gateway /v1</text>
<text x="1395.0" y="644" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">调度器按需启动 resident</text>
<text x="1395.0" y="660" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">应用不持有 PID / endpoint</text>
<rect x="40" y="600" width="500" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="290.0" y="624" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#1f2937">不变量</text>
<text x="290.0" y="644" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">应用状态不保存模型 pid 或 child endpoint。</text>
<text x="290.0" y="660" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#475569">所有推理都走网关。</text>
<path d="M 280,405 L 330,405" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="305" y="395" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#64748b" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">安装</text>
<path d="M 580,405 L 630,405" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="605" y="395" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#64748b" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">脚本/安装包完成</text>
<path d="M 880,405 L 930,405" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="905" y="395" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#64748b" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">显式配置</text>
<path d="M 1180,405 L 1230,405" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1205" y="395" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#64748b" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">setup 成功</text>
<path d="M 1180,440 L 1230,440" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="1205" y="432" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#f59e0b" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">脚本失败仍 READY</text>
<path d="M 455,350 L 455,280" fill="none" stroke="#ef4444" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="420" y="310" text-anchor="end" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#ef4444" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">失败</text>
<path d="M 520,280 L 520,350" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="527" y="330" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#94a3b8" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">重试</text>
<path d="M 160,350 L 160,300 L 755,300 L 755,350" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="450" y="290" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#94a3b8" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">跳过 / 不准备模型</text>
<path d="M 1350,460 L 1350,600" fill="none" stroke="#0284c7" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="1358" y="540" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#0284c7" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">推理请求</text>
<path d="M 1230,460 L 1205,460 L 1205,760 L 600,760 L 600,500 L 280,500 L 280,460" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="750" y="750" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" fill="#94a3b8" stroke="#f7f9fc" stroke-width="4" paint-order="stroke">卸载 / 重新安装</text>
</svg>