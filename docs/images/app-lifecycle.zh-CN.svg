<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/></filter>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/></marker>
</defs>
<rect width="1600" height="900" fill="#F7F9FC"/>
<path d="M 48 100 L 1552 100" stroke="#E2E8F0" stroke-width="1"/>
<text x="48" y="64" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#0F172A">flashserver 应用生命周期</text>
<text x="1552" y="64" text-anchor="end" font-family="JetBrains Mono, Consolas, monospace" font-size="12" font-weight="400" fill="#94A3B8">v1</text>
<rect x="48" y="160" width="1504" height="470" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.1" filter="url(#shadow)"/>
<circle cx="70" cy="188" r="4.2" fill="#2563EB"/>
<text x="82" y="194" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18.5" font-weight="700" fill="#0F172A">应用生命周期</text>
<rect x="64" y="250" width="240" height="132" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.1" filter="url(#shadow)"/>
<circle cx="84" cy="278" r="4.2" fill="#2563EB"/>
<text x="96" y="284" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#0F172A">PLANNED</text>
<text x="84" y="320" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#475569">manifest 合法</text>
<text x="84" y="342" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#94A3B8">平台支持</text>
<rect x="356" y="250" width="240" height="132" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.1" filter="url(#shadow)"/>
<circle cx="376" cy="278" r="4.2" fill="#B45309"/>
<text x="388" y="284" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#0F172A">INSTALL</text>
<text x="376" y="320" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#475569">客户端脚本 / 安装器</text>
<text x="376" y="342" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#94A3B8">或 skip（仅准备模型）</text>
<rect x="648" y="250" width="240" height="132" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.1" filter="url(#shadow)"/>
<circle cx="668" cy="278" r="4.2" fill="#0F766E"/>
<text x="680" y="284" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#0F172A">PREPARED</text>
<text x="668" y="320" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#475569">default bundles</text>
<text x="668" y="342" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#94A3B8">磁盘就绪（preload）</text>
<rect x="940" y="250" width="240" height="132" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.1" filter="url(#shadow)"/>
<circle cx="960" cy="278" r="4.2" fill="#2563EB"/>
<text x="972" y="284" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#0F172A">SETUP</text>
<text x="960" y="320" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#475569">不是持久化状态</text>
<text x="960" y="342" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#94A3B8">写入网关连接</text>
<rect x="1232" y="250" width="240" height="132" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.1" filter="url(#shadow)"/>
<circle cx="1252" cy="278" r="4.2" fill="#0F766E"/>
<text x="1264" y="284" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#0F172A">READY</text>
<text x="1252" y="320" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#475569">应用已配置</text>
<text x="1252" y="342" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#94A3B8">推理走 /v1</text>
<text x="956" y="366" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.3" font-weight="400" fill="#94A3B8">执行确认过的 setup scripts</text>
<path d="M 304 316 L 356 316" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
<path d="M 596 316 L 648 316" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
<path d="M 888 316 L 940 316" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
<path d="M 1180 316 L 1232 316" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
<rect x="356" y="430" width="240" height="120" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.1" filter="url(#shadow)"/>
<circle cx="376" cy="458" r="4.2" fill="#DC2626"/>
<text x="388" y="464" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#0F172A">FAILED</text>
<text x="376" y="500" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#475569">安装 / 准备失败</text>
<text x="376" y="522" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" fill="#94A3B8">保留日志</text>
<path d="M 476 382 L 476 430" fill="none" stroke="#DC2626" stroke-width="1.4" marker-end="url(#arrow-red)"/>
<text x="476" y="414" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#94A3B8">failure</text>
<text x="64" y="600" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.5" font-weight="400" fill="#94A3B8">SETUP 失败可回退到 READY 或重试；应用始终不管理模型进程。</text>
<rect x="48" y="660" width="700" height="180" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.1" filter="url(#shadow)"/>
<circle cx="70" cy="688" r="4.2" fill="#0F766E"/>
<text x="82" y="694" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18.5" font-weight="700" fill="#0F172A">运行时边界</text>
<rect x="64" y="716" width="668" height="62" rx="9" fill="#F8FAFC" stroke="#E8EEF5" stroke-width="1"/>
<text x="77" y="735" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.1" font-weight="600" fill="#0F172A">Gateway /v1</text>
<text x="77" y="751" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.3" font-weight="400" fill="#94A3B8">统一推理入口；调度器按需启动 resident</text>
<text x="77" y="766" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.3" font-weight="400" fill="#94A3B8">应用不拥有 PID / endpoint</text>
<rect x="64" y="790" width="668" height="62" rx="9" fill="#F8FAFC" stroke="#E8EEF5" stroke-width="1"/>
<text x="77" y="809" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.1" font-weight="600" fill="#0F172A">App status</text>
<text x="77" y="825" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.3" font-weight="400" fill="#94A3B8">应用状态不包含 child endpoint</text>
<text x="77" y="840" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.3" font-weight="400" fill="#94A3B8">推理始终走 /v1</text>
<rect x="788" y="660" width="764" height="180" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.1" filter="url(#shadow)"/>
<circle cx="810" cy="688" r="4.2" fill="#B45309"/>
<text x="822" y="694" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="18.5" font-weight="700" fill="#0F172A">卸载</text>
<rect x="804" y="716" width="732" height="62" rx="9" fill="#F8FAFC" stroke="#E8EEF5" stroke-width="1"/>
<text x="817" y="735" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.1" font-weight="600" fill="#0F172A">Remove app</text>
<text x="817" y="751" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.3" font-weight="400" fill="#94A3B8">删除应用记录与安装目录</text>
<text x="817" y="766" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.3" font-weight="400" fill="#94A3B8">模型缓存保留，除非显式清理</text>
<rect x="804" y="790" width="732" height="62" rx="9" fill="#F8FAFC" stroke="#E8EEF5" stroke-width="1"/>
<text x="817" y="809" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12.1" font-weight="600" fill="#0F172A">Reinstall</text>
<text x="817" y="825" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.3" font-weight="400" fill="#94A3B8">重新安装不要求重新下载模型</text>
<text x="817" y="840" text-anchor="start" font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="10.3" font-weight="400" fill="#94A3B8">磁盘状态由 preload 管理</text>
</svg>
